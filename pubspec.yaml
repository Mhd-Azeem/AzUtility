name: az_utility
description: Offline-first network, file and device utilities in one application.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.12.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 18.1.2
  fl_chart: 1.3.0
  drift: 2.35.3
  sqlite3: 3.8.0
  path_provider: 2.1.6
  file_picker: 13.3.1
  path: 1.9.1
  crypto: 3.0.8
  archive: 4.6.0
  pdf: 3.13.1
  open_filex: 5.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
