name: Android 15 native integration
on:
  workflow_dispatch:
  push:
    branches: ['feature/az-utility']
    paths: ['android/**', 'integration_test/**', '.github/workflows/android-integration.yml']
permissions:
  contents: read
jobs:
  android-15:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ORG_GRADLE_PROJECT_azEmulator: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - run: flutter pub get
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/android_integration.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-15-integration-logs
          path: |
            integration.log
            android-logcat.txt
