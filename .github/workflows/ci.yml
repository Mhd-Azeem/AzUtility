name: Verify and package AZ Utility
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify formatting, analysis and tests
        run: |
          dart format --output=none --set-exit-if-changed lib test integration_test
          flutter analyze
          flutter test
      - name: Configure optional production signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 --decode > android/release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          fi
      - run: chmod +x android/gradlew
      - run: flutter build apk --release --target-platform android-arm64
      - name: Package with honest signing label
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p dist
          suffix="-test-signed"
          if [ -n "$KEYSTORE" ]; then suffix=""; fi
          cp build/app/outputs/flutter-apk/app-release.apk "dist/AZUtility-v1.0.0-android-arm64${suffix}.apk"
          cd dist && sha256sum *.apk > SHA256SUMS-android.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AZUtility-android-arm64
          path: dist/*
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release
      - run: ./scripts/package_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: AZUtility-windows-x64-unsigned
          path: dist/*
